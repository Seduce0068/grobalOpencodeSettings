# 検証プロファイル: rust-lib-moderate
#
# これは「このプロジェクトが何を主張するか」の宣言である。
# 外部への適合宣言 (ASVS 準拠 / EAL 取得 / SP 800-53 適合) ではない。
profile: rust-lib-moderate
description: Rust ライブラリ。統制は依存クレートの供应链と CI に限る。

basis:
  iso29119:
    mode: tailored
    parts: ["29119-2:2021", "29119-3:2021", "29119-4:2021"]
  asvs:
    version: "5.0.0"
    level: 1
    scope: []
  nist800_53:
    release: "5.2.0"
    baseline: moderate
    focus: [SA, SI, CM]
  cc_assurance:
    - ATE_FUN.1
    - ATE_COV.2

techniques:
  - {id: equivalence-partitioning, ref: "29119-4 5.2.1"}
  - {id: boundary-value-analysis, ref: "29119-4 5.2.3"}
  - {id: metamorphic-testing, ref: "29119-4 5.2.11"}
  - {id: statement-testing, ref: "29119-4 5.3.1"}
  - {id: branch-testing, ref: "29119-4 5.3.2"}
  - {id: error-guessing, ref: "29119-4 5.4.1"}

risk_tiers:
  T1:
    condition: 安全属性に関わる API (暗号・認証・シリアライズ)
    coverage: {unit: 0.90}
    required_techniques:
      - equivalence-partitioning
      - boundary-value-analysis
      - metamorphic-testing
  T2:
    condition: 公開 API
    coverage: {unit: 0.80}
    required_techniques:
      - equivalence-partitioning
  T3:
    condition: 内部ヘルパ
    coverage: {unit: 0.60}
    required_techniques:
      - equivalence-partitioning

gates:
  coverage: {unit: 0.80, integration: 0.60}
  flaky_runs: 10
  assurance_target: A2
