[package]
name = "okf_common"
version = "0.1.0"
edition = "2021"

[dependencies]
serde = { version = "1.0", features = ["derive"] }
serde_yaml = "0.9"
chrono = { version = "0.4", features = ["serde"] }
regex = "1.10"
thiserror = "1.0"
anyhow = "1.0"
clap = { version = "4.5", features = ["derive"] }
once_cell = "1.19"

[profile.release]
strip = true

[profile.dev]
debug = "line-tables-only"

[profile.dev.package."*"]
debug = false
